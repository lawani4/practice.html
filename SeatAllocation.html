<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seat Allocator</title>
<style>
  :root {
    --ink: #1c2b24;
    --paper: #f6f4ee;
    --card: #ffffff;
    --moss: #2f6b4f;
    --moss-dark: #234f3a;
    --line: #dcd7c9;
    --error: #b3402a;
    --error-bg: #fbeae6;
    --ok: #2f6b4f;
    --ok-bg: #e9f2ec;
    --muted: #6b6a63;
    --taken: #c9c5b6;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    color: var(--ink);
  }

  .app {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  h1 {
    font-size: 26px;
    font-weight: 500;
    margin: 0;
  }

  .tabs {
    display: flex;
    gap: 6px;
    font-family: var(--sans);
  }

  .tab-btn {
    padding: 8px 14px;
    font-size: 13.5px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    border-radius: 3px;
    cursor: pointer;
  }

  .tab-btn.active {
    background: var(--moss);
    border-color: var(--moss);
    color: #fff;
  }

  .refresh-btn {
    font-family: var(--sans);
    font-size: 13.5px;
    padding: 8px 14px;
    border: 1px solid var(--error);
    color: var(--error);
    background: #fff;
    border-radius: 3px;
    cursor: pointer;
  }

  .refresh-btn:hover {
    background: var(--error-bg);
  }

  .page { display: none; }
  .page.active { display: block; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 28px;
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-family: var(--sans);
    font-size: 13px;
    margin-bottom: 6px;
  }

  input[type="text"] {
    width: 100%;
    font-family: var(--sans);
    font-size: 15px;
    padding: 11px 12px;
    border: 1px solid #b9b6a8;
    border-radius: 3px;
    background: #fffefb;
    color: var(--ink);
    outline: none;
  }

  input[type="text"]:focus {
    border-color: var(--moss);
    box-shadow: 0 0 0 3px rgba(47, 107, 79, 0.12);
  }

  .field { margin-bottom: 20px; }

  .mode-toggle {
    display: flex;
    gap: 8px;
    font-family: var(--sans);
    margin-bottom: 20px;
  }

  .mode-btn {
    flex: 1;
    padding: 9px 10px;
    font-size: 13px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--muted);
    border-radius: 3px;
    cursor: pointer;
  }

  .mode-btn.active {
    background: var(--moss);
    border-color: var(--moss);
    color: #fff;
  }

  .legend {
    display: flex;
    gap: 18px;
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 18px;
  }

  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .swatch {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    display: inline-block;
  }

  .swatch.avail { background: #fff; border: 1.5px solid var(--moss); }
  .swatch.sel { background: var(--moss); }
  .swatch.taken { background: var(--taken); }

  .row-block { margin-bottom: 14px; }

  .row-label {
    font-family: var(--sans);
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }

  .seat-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .seat-btn {
    width: 46px;
    height: 46px;
    border-radius: 4px;
    border: 1.5px solid var(--moss);
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    position: relative;
  }

  .seat-btn svg { width: 22px; height: 22px; }
  .seat-btn .seat-shape { fill: none; stroke: var(--moss); stroke-width: 1.6; }

  .seat-btn.selected {
    background: var(--moss);
  }
  .seat-btn.selected .seat-shape { stroke: #fff; }

  .seat-btn.taken {
    border-color: var(--line);
    background: #ece9df;
    cursor: not-allowed;
  }
  .seat-btn.taken .seat-shape { stroke: var(--taken); }

  .seat-btn.taken::after,
  .seat-btn.taken::before {
    content: "";
    position: absolute;
    width: 130%;
    height: 1.6px;
    background: var(--error);
    top: 50%;
    left: 50%;
  }
  .seat-btn.taken::after { transform: translate(-50%, -50%) rotate(45deg); }
  .seat-btn.taken::before { transform: translate(-50%, -50%) rotate(-45deg); }

  .map-seat-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 58px;
  }

  .map-name {
    font-family: var(--sans);
    font-size: 9.5px;
    color: var(--muted);
    text-align: center;
    line-height: 1.2;
    max-width: 58px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .selected-preview {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    margin: 18px 0;
    padding: 10px 12px;
    background: var(--paper);
    border-radius: 3px;
    border: 1px solid var(--line);
  }

  .selected-preview strong { color: var(--ink); }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }

  button.primary,
  button.secondary {
    font-family: var(--sans);
    font-size: 14.5px;
    font-weight: 600;
    padding: 12px;
    border-radius: 3px;
    cursor: pointer;
    flex: 1;
  }

  button.primary {
    background: var(--moss);
    border: 1px solid var(--moss);
    color: #fff;
  }
  button.primary:hover { background: var(--moss-dark); }

  button.secondary {
    background: #fff;
    border: 1px solid var(--moss);
    color: var(--moss);
  }
  button.secondary:hover { background: var(--ok-bg); }

  .banner {
    font-family: var(--sans);
    font-size: 13.5px;
    padding: 12px 14px;
    border-radius: 3px;
    margin-top: 18px;
    display: none;
  }
  .banner.show { display: block; }
  .banner.success { background: var(--ok-bg); color: var(--moss-dark); border: 1px solid #b9d6c4; }
  .banner.error { background: var(--error-bg); color: var(--error); border: 1px solid #edc3b8; }

  .empty-note {
    font-family: var(--sans);
    font-size: 13.5px;
    color: var(--muted);
    text-align: center;
    padding: 30px 0;
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <h1>Seat Allocator</h1>
    <div class="tabs">
      <button class="tab-btn active" id="tabClaimBtn" onclick="switchTab('claim')">Claim / Reselect</button>
      <button class="tab-btn" id="tabMapBtn" onclick="switchTab('map')">Seat Map</button>
    </div>
    <button class="refresh-btn" onclick="refreshAll()">Refresh</button>
  </header>

  <!-- ===================== CLAIM / RESELECT PAGE ===================== -->
  <section class="page active" id="claimPage">
    <div class="card">
      <div class="field">
        <label for="nameInput">Your name</label>
        <input type="text" id="nameInput" placeholder="e.g. Ada Lovelace" autocomplete="name">
      </div>

      <div class="mode-toggle">
        <button type="button" class="mode-btn active" id="modeSingleBtn" onclick="setMode('single')">Single seat</button>
        <button type="button" class="mode-btn" id="modeMultiBtn" onclick="setMode('multiple')">Multiple seats</button>
      </div>

      <div class="legend">
        <span><i class="swatch avail"></i>Available</span>
        <span><i class="swatch sel"></i>Selected</span>
        <span><i class="swatch taken"></i>Taken</span>
      </div>

      <div id="pickerGrid"></div>

      <div class="selected-preview" id="selectedPreview">No seats selected yet.</div>

      <div class="actions">
        <button type="button" class="primary" onclick="claimSeats()">Claim Seat(s)</button>
        <button type="button" class="secondary" onclick="reselectSeats()">Reselect Seat(s)</button>
      </div>

      <div class="banner" id="claimBanner"></div>
    </div>
  </section>

  <section class="page" id="mapPage">
    <div class="card">
      <div class="legend">
        <span><i class="swatch avail"></i>Available</span>
        <span><i class="swatch taken"></i>Taken</span>
      </div>
      <div id="mapGrid"></div>
    </div>
  </section>
</div>

<script>
  const ROWS = ['A', 'B', 'C', 'D', 'E'];
  const SEATS_PER_ROW = 8;

  let seatState = {};
  // seats the user currently has highlighted/picked in the claim form
  let selectedSeats = [];
  // 'single' or 'multiple'
  let selectionMode = 'single';

  function initSeats() {
    seatState = {};
    ROWS.forEach(row => {
      for (let i = 1; i <= SEATS_PER_ROW; i++) {
        seatState[row + i] = null;
      }
    });
  }

  function seatSvg() {
    return `<svg viewBox="0 0 24 24"><path class="seat-shape" d="M6 10V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4M5 10h14a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1zM6 15v3M18 15v3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }

  function renderPickerGrid() {
    const container = document.getElementById('pickerGrid');
    container.innerHTML = '';

    ROWS.forEach(row => {
      const rowBlock = document.createElement('div');
      rowBlock.className = 'row-block';

      const rowLabel = document.createElement('div');
      rowLabel.className = 'row-label';
      rowLabel.textContent = 'Row ' + row;
      rowBlock.appendChild(rowLabel);

      const rowSeats = document.createElement('div');
      rowSeats.className = 'seat-row';

      for (let i = 1; i <= SEATS_PER_ROW; i++) {
        const seatId = row + i;
        const occupant = seatState[seatId];
        const isTaken = occupant !== null;
        const isSelected = selectedSeats.includes(seatId);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'seat-btn' + (isTaken ? ' taken' : '') + (isSelected ? ' selected' : '');
        btn.title = isTaken ? (seatId + ' — taken by ' + occupant) : (seatId + ' — available');
        btn.innerHTML = seatSvg();
        if (!isTaken) {
          btn.addEventListener('click', () => toggleSeatSelection(seatId));
        }
        rowSeats.appendChild(btn);
      }

      rowBlock.appendChild(rowSeats);
      container.appendChild(rowBlock);
    });
  }

  // ---------- Rendering: read-only map (Seat Map page) ----------
  function renderMapGrid() {
    const container = document.getElementById('mapGrid');
    container.innerHTML = '';

    ROWS.forEach(row => {
      const rowBlock = document.createElement('div');
      rowBlock.className = 'row-block';

      const rowLabel = document.createElement('div');
      rowLabel.className = 'row-label';
      rowLabel.textContent = 'Row ' + row;
      rowBlock.appendChild(rowLabel);

      const rowSeats = document.createElement('div');
      rowSeats.className = 'seat-row';

      for (let i = 1; i <= SEATS_PER_ROW; i++) {
        const seatId = row + i;
        const occupant = seatState[seatId];
        const isTaken = occupant !== null;

        const wrap = document.createElement('div');
        wrap.className = 'map-seat-wrap';

        const icon = document.createElement('div');
        icon.className = 'seat-btn' + (isTaken ? ' taken' : '');
        icon.style.cursor = 'default';
        icon.title = isTaken ? (seatId + ' — ' + occupant) : (seatId + ' — available');
        icon.innerHTML = seatSvg();

        const caption = document.createElement('div');
        caption.className = 'map-name';
        caption.textContent = isTaken ? occupant : seatId;

        wrap.appendChild(icon);
        wrap.appendChild(caption);
        rowSeats.appendChild(wrap);
      }

      rowBlock.appendChild(rowSeats);
      container.appendChild(rowBlock);
    });
  }

  // ---------- Selection logic ----------
  function toggleSeatSelection(seatId) {
    if (selectionMode === 'single') {
      selectedSeats = selectedSeats.includes(seatId) ? [] : [seatId];
    } else {
      if (selectedSeats.includes(seatId)) {
        selectedSeats = selectedSeats.filter(s => s !== seatId);
      } else {
        selectedSeats.push(seatId);
      }
    }
    renderPickerGrid();
    updateSelectedPreview();
  }

  function setMode(mode) {
    selectionMode = mode;
    document.getElementById('modeSingleBtn').classList.toggle('active', mode === 'single');
    document.getElementById('modeMultiBtn').classList.toggle('active', mode === 'multiple');

    // trim selection down to one seat if switching to single mode
    if (mode === 'single' && selectedSeats.length > 1) {
      selectedSeats = [selectedSeats[0]];
    }
    renderPickerGrid();
    updateSelectedPreview();
  }

  function updateSelectedPreview() {
    const el = document.getElementById('selectedPreview');
    if (selectedSeats.length === 0) {
      el.innerHTML = 'No seats selected yet.';
    } else {
      el.innerHTML = 'Selected: <strong>' + selectedSeats.slice().sort().join(', ') + '</strong>';
    }
  }

  // ---------- Actions ----------
  function claimSeats() {
    const name = document.getElementById('nameInput').value.trim();
    const banner = document.getElementById('claimBanner');

    if (!name) {
      showBanner(banner, 'Please enter your name first.', 'error');
      return;
    }
    if (selectedSeats.length === 0) {
      showBanner(banner, 'Select at least one seat before claiming.', 'error');
      return;
    }

    const alreadyTaken = selectedSeats.filter(s => seatState[s] !== null);
    if (alreadyTaken.length > 0) {
      showBanner(banner, 'Seat(s) ' + alreadyTaken.join(', ') + ' just got taken — pick another.', 'error');
      renderPickerGrid();
      return;
    }

    selectedSeats.forEach(seatId => {
      seatState[seatId] = name;
    });

    showBanner(banner, 'Success! ' + name + ' claimed: ' + selectedSeats.slice().sort().join(', '), 'success');
    selectedSeats = [];
    renderPickerGrid();
    renderMapGrid();
    updateSelectedPreview();
  }

  function reselectSeats() {
    const name = document.getElementById('nameInput').value.trim();
    const banner = document.getElementById('claimBanner');

    if (!name) {
      showBanner(banner, 'Enter the name you originally claimed a seat under.', 'error');
      return;
    }

    const currentSeats = Object.keys(seatState).filter(s => seatState[s] === name);
    if (currentSeats.length === 0) {
      showBanner(banner, 'No existing seat(s) found for "' + name + '". Use "Claim Seat(s)" instead.', 'error');
      return;
    }
    if (selectedSeats.length === 0) {
      showBanner(banner, 'Select the new seat(s) you want to move to.', 'error');
      return;
    }

    const alreadyTaken = selectedSeats.filter(s => seatState[s] !== null && seatState[s] !== name);
    if (alreadyTaken.length > 0) {
      showBanner(banner, 'Seat(s) ' + alreadyTaken.join(', ') + ' are already taken by someone else.', 'error');
      renderPickerGrid();
      return;
    }

    // free old seats, assign new ones
    currentSeats.forEach(s => { seatState[s] = null; });
    selectedSeats.forEach(s => { seatState[s] = name; });

    showBanner(banner, name + ' moved from ' + currentSeats.join(', ') + ' to ' + selectedSeats.slice().sort().join(', ') + '.', 'success');
    selectedSeats = [];
    renderPickerGrid();
    renderMapGrid();
    updateSelectedPreview();
  }

  function showBanner(el, text, type) {
    el.textContent = text;
    el.className = 'banner show ' + type;
  }

  function refreshAll() {
    initSeats();
    selectedSeats = [];
    selectionMode = 'single';
    document.getElementById('nameInput').value = '';
    document.getElementById('modeSingleBtn').classList.add('active');
    document.getElementById('modeMultiBtn').classList.remove('active');
    document.getElementById('claimBanner').className = 'banner';
    document.getElementById('claimBanner').textContent = '';
    renderPickerGrid();
    renderMapGrid();
    updateSelectedPreview();
    switchTab('claim');
  }

  // ---------- Tab navigation ----------
  function switchTab(tab) {
    document.getElementById('claimPage').classList.toggle('active', tab === 'claim');
    document.getElementById('mapPage').classList.toggle('active', tab === 'map');
    document.getElementById('tabClaimBtn').classList.toggle('active', tab === 'claim');
    document.getElementById('tabMapBtn').classList.toggle('active', tab === 'map');
    if (tab === 'map') renderMapGrid();
  }

  // ---------- Init ----------
  initSeats();
  renderPickerGrid();
  renderMapGrid();
  updateSelectedPreview();
</script>

</body>
</html>
